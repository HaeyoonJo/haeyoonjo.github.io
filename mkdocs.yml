site_name: My Blog
site_description: A space for development notes and personal writing
site_url: https://haeyoonjo.github.io/

repo_url: https://github.com/HaeyoonJo/haeyoonjo.github.io
repo_name: Github
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        # - ko
  - blog

  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true

        # - locale: ko
        #   name: 한국어
        #   build: true
        #   site_name: 나의 블로그
          # nav_translations:
          #   Home: 홈
          #   Blog: 블로그

extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Blog:
      - blog/index.md
      - blog/posts/hello.md
  - ML Platform:
      - ml_platform/index.md
  - Deutsch:
      - Deutsch/Prateritum.md
      - Deutsch/Komparativ_Superlativ_Adjektivdeklination_Faelle.md
      - Deutsch/Wenn_Falls_Bei.md

theme:
  name: material
  custom_dir: overrides
