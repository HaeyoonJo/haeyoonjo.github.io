site_name: My Blog
site_description: A space for development notes and personal writing
site_url: https://haeyoonjo.github.io/

repo_url: https://github.com/HaeyoonJo/haeyoonjo.github.io
repo_name: Github
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        # - ko
  - blog

  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        # - locale: ko
        #   name: 한국어
        #   build: true
        #   site_name: 나의 블로그
          # nav_translations:
          #   Home: 홈
          #   Blog: 블로그

nav:
  - Home: index.md
  - ML Platform:
      - ml_platform/index.md
      - ml_platform/about-this-book.md
      - ml_platform/CH_1-3.md
      - ml_platform/CH_4-5.md
      - ml_platform/CH_6-7.md
      - ml_platform/ml-platform-engineering-part-3.md
      - ml_platform/chapter-11.md
      - ml_platform/chapter-12.md
      - ml_platform/chapter-13.md
  - Deutsch:
      - Deutsch/index.md
      - A2 Wiederholung:
          - Deutsch/a2/index.md
          - Artikelwörter und Adjektivdeklination: Deutsch/a2/artikel-und-adjektivdeklination.md
          - Direkte und indirekte Objekte: Deutsch/a2/direkte-und-indirekte-objekte.md
          - Personal- und Reflexivpronomen: Deutsch/a2/personal-und-reflexivpronomen.md
          - Präteritum und Perfekt: Deutsch/a2/praeteritum-und-perfekt.md
          - Wenn, falls und bei: Deutsch/a2/wenn-falls-bei.md
          - Komparativ, Superlativ und Adjektivdeklination: Deutsch/a2/komparativ-superlativ-adjektivdeklination.md
          - n-Deklination: Deutsch/a2/n-deklination.md
          - Relativpronomen: Deutsch/a2/relativpronomen.md
          - Richtungsadverbien: Deutsch/a2/richtungsadverbien.md
      - B1 Vorbereitung: Deutsch/b1/index.md
      - B2 Ausbau: Deutsch/b2/index.md
